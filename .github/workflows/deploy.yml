name: Deploy Astro to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Astro
        run: npm install && npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Upload build to VPS
        run: |
          rsync -avz -e ssh dist/ vps:/home/${{ secrets.VPS_USER }}/docker/nmclauncher-site/dist/

      - name: Restart Docker Compose
        run: |
          ssh vps "cd /home/${{ secrets.VPS_USER }}/docker/nmclauncher-site && sudo docker compose down && sudo docker compose up -d --build"
